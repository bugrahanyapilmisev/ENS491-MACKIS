[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Her test çalışmasında coverage raporu üret
addopts =
    -v
    --tb=short
    --cov=routers
    --cov=utils
    --cov-report=term-missing
    --cov-report=html:htmlcov

# Async test desteği (ileride gerekirse)
asyncio_mode = auto

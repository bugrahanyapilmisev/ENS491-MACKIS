version: "3.9"

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mackis-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      # ChromaDB kalıcı depolama
      - ./creating_database/chroma_db_v2:/app/creating_database/chroma_db_v2
      # Knowledge Graph kalıcı depolama
      - ./creating_kg/knowledge_graph:/app/creating_kg/knowledge_graph
    ports:
      - "8000:8000"
    networks:
      - mackis-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Frontend (React + Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mackis-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mackis-net

networks:
  mackis-net:
    driver: bridge


